<text x="1705" y="1110" class="tiny" text-anchor="middle" >concat[p2, p3, p4]</text>
<path id="" d="M1570,1087 L1515,1087" class="arrow"/>
<rect id="mlp" x="1265" y="1045" width="240" height="85" rx="18" class="head"/>
<text x="1385" y="1080" class="small-bold" text-anchor="middle" >Shared MLP + dropout</text>
<text x="1385" y="1110" class="tiny" text-anchor="middle" >192 hidden units</text>
<path id="" d="M1255,1087 L1200,1087" class="arrow"/>
<rect id="head" x="990" y="1045" width="200" height="85" rx="18" class="head"/>
<text x="1090" y="1080" class="small-bold" text-anchor="middle" >Viability head</text>
<text x="1090" y="1110" class="tiny" text-anchor="middle" >score ∈ [0,1]</text>
</g>
</svg>