<text x="1232" y="593" class="body" text-anchor="middle" >C2</text>
<text x="1232" y="620" class="tiny" text-anchor="middle" >C=192</text>
<path id="" d="M1320,595 L1370,595" class="arrow"/>
<rect id="gap-C2" x="1380" y="560" width="185" height="70" rx="18" class="node"/>
<text x="1472" y="588" class="small" text-anchor="middle"><tspan x="1472" dy="0">Global</tspan><tspan x="1472" dy="23">avg pooling</tspan></text>
<path id="" d="M1570,595 L1615,595" class="arrow"/>
<rect id="projection-C2" x="1625" y="560" width="210" height="70" rx="18" class="projection"/>
<text x="1730" y="588" class="small" text-anchor="middle"><tspan x="1730" dy="0">Linear</tspan><tspan x="1730" dy="23">projection → 64</tspan></text>
<rect id="stage-C3" x="1150" y="740" width="165" height="70" rx="18" class="stage"/>
<text x="1232" y="773" class="body" text-anchor="middle" >C3</text>
<text x="1232" y="800" class="tiny" text-anchor="middle" >C=384</text>
<path id="" d="M1320,775 L1370,775" class="arrow"/>
<rect id="gap-C3" x="1380" y="740" width="185" height="70" rx="18" class="node"/>
<text x="1472" y="768" class="small" text-anchor="middle"><tspan x="1472" dy="0">Global</tspan><tspan x="1472" dy="23">avg pooling</tspan></text>
<path id="" d="M1570,775 L1615,775" class="arrow"/>
<rect id="projection-C3" x="1625" y="740" width="210" height="70" rx="18" class="projection"/>
<text x="1730" y="768" class="small" text-anchor="middle"><tspan x="1730" dy="0">Linear</tspan><tspan x="1730" dy="23">projection → 64</tspan></text>
<rect id="stage-C4" x="1150" y="920" width="165" height="70" rx="18" class="stage"/>
<text x="1232" y="953" class="body" text-anchor="middle" >C4</text>
<text x="1232" y="980" class="tiny" text-anchor="middle" >C=768</text>
<path id="" d="M1320,955 L1370,955" class="arrow"/>
<rect id="gap-C4" x="1380" y="920" width="185" height="70" rx="18" class="node"/>
<text x="1472" y="948" class="small" text-anchor="middle"><tspan x="1472" dy="0">Global</tspan><tspan x="1472" dy="23">avg pooling</tspan></text>
<path id="" d="M1570,955 L1615,955" class="arrow"/>
<rect id="projection-C4" x="1625" y="920" width="210" height="70" rx="18" class="projection"/>
<text x="1730" y="948" class="small" text-anchor="middle"><tspan x="1730" dy="0">Linear</tspan><tspan x="1730" dy="23">projection → 64</tspan></text>
<path d="M1835 595 H1850 V1087 H1830" class="line"/><path d="M1835 775 H1850" class="line"/><path d="M1835 955 H1850" class="line"/>
<rect id="fusion" x="1580" y="1045" width="250" height="85" rx="18" class="projection"/>
