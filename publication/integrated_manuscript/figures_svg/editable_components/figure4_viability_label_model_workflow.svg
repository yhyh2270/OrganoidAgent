<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1900" height="1260" viewBox="0 0 1900 1260">
    <title>Fluorescence-derived label construction and bright-field viability regression</title>
    <defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#496f7d"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#17252b} .panel{fill:#f7fafb;stroke:#aac3cc;stroke-width:3} .panel-label{font-size:40px;font-weight:700} .panel-title{font-size:33px;font-weight:600} .body{font-size:27px} .small{font-size:23px} .small-bold{font-size:23px;font-weight:700} .tiny{font-size:19px} .tiny-bold{font-size:19px;font-weight:700}
    .node{fill:#fff;stroke:#4f899b;stroke-width:3} .soft-node{fill:#e9f3f6;stroke:#4f899b;stroke-width:3} .arrow{fill:none;stroke:#496f7d;stroke-width:3;marker-end:url(#arrowhead)} .line{fill:none;stroke:#496f7d;stroke-width:3} .dash{fill:none;stroke:#718f9a;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrowhead)}
    .green{fill:#e7f5ec;stroke:#56a776;stroke-width:3} .red{fill:#fff0f0;stroke:#d66a6a;stroke-width:3} .blue{fill:#e8f1fb;stroke:#5d8fbd;stroke-width:3} .stage{fill:#dfe9f5;stroke:#496f7d;stroke-width:3} .projection{fill:#f5e3a3;stroke:#816b2b;stroke-width:3} .head{fill:#e7f1df;stroke:#496f7d;stroke-width:3}
    .chart-bg{fill:#fff;stroke:#7da5b2;stroke-width:2} .chart-axis{fill:none;stroke:#6c8790;stroke-width:2}</style></defs><rect width="100%" height="100%" fill="white"/>
<g id="panel-A"><rect id="panel-A-background" x="16" y="16" width="1225" height="430" rx="18" class="panel"/><text x="34" y="54" class="panel-label" text-anchor="start" >A</text><text x="74" y="54" class="panel-title" text-anchor="start" >Fluorescence quality control and label construction</text>
<g><rect x="55" y="105" width="115" height="100" rx="8" fill="#101418" stroke="#4f899b" stroke-width="2"/><circle cx="112" cy="155" r="31" fill="#2ec56f" opacity=".9"/><text x="112" y="233" class="small-bold" text-anchor="middle">LIVE</text></g>
<g><rect x="195" y="105" width="115" height="100" rx="8" fill="#101418" stroke="#4f899b" stroke-width="2"/><circle cx="252" cy="155" r="31" fill="#e44f5f" opacity=".9"/><text x="252" y="233" class="small-bold" text-anchor="middle">DEAD</text></g>
<path id="" d="M325,155 L405,155" class="arrow"/>
<rect id="references" x="415" y="82" width="240" height="145" rx="18" class="node"/>
<text x="535" y="117" class="small-bold" text-anchor="middle" >Expert references</text>
<text x="535" y="151" class="small" text-anchor="middle"><tspan x="535" dy="0">usable / unusable</tspan><tspan x="535" dy="26">few-shot examples</tspan></text>
<path id="" d="M665,155 L735,155" class="arrow"/>
<rect id="rubric" x="745" y="82" width="205" height="145" rx="18" class="soft-node"/>
<text x="847" y="117" class="small-bold" text-anchor="middle" >QC rubric</text>
<text x="847" y="151" class="tiny" text-anchor="middle"><tspan x="847" dy="0">signal</tspan><tspan x="847" dy="22">background</tspan><tspan x="847" dy="22">exposure</tspan><tspan x="847" dy="22">artifacts</tspan></text>
<path id="" d="M960,155 L1030,155" class="arrow"/>
<rect id="vision-qc" x="1040" y="82" width="165" height="145" rx="18" class="soft-node"/>
<text x="1122" y="117" class="small-bold" text-anchor="middle" >Vision QC</text>
<text x="1122" y="153" class="tiny" text-anchor="middle"><tspan x="1122" dy="0">channel-wise</tspan><tspan x="1122" dy="24">label + reason</tspan></text>
<path d="M1122 227 V265 H965" class="line"/>
<rect id="green-qc" x="735" y="260" width="215" height="80" rx="18" class="green"/>
<text x="842" y="292" class="small-bold" text-anchor="middle" >Green-channel QC</text>
<text x="842" y="322" class="tiny" text-anchor="middle" >usable / unusable</text>
<rect id="red-qc" x="970" y="260" width="215" height="80" rx="18" class="red"/>
<text x="1077" y="292" class="small-bold" text-anchor="middle" >Red-channel QC</text>
<text x="1077" y="322" class="tiny" text-anchor="middle" >usable / unusable</text>
<path d="M735 300 H650 V360 H570" class="line"/><path d="M970 300 H925 V360 H570" class="line"/>
<rect id="sample-decision" x="380" y="345" width="190" height="74" rx="18" class="node"/>
<text x="475" y="375" class="small-bold" text-anchor="middle" >Sample decision</text>
<text x="475" y="405" class="tiny" text-anchor="middle" >both channels pass</text>
<path id="" d="M370,382 L275,382" class="arrow"/>
<rect id="retained" x="55" y="345" width="210" height="74" rx="18" class="blue"/>
<text x="160" y="375" class="small-bold" text-anchor="middle" >Retained samples</text>
<text x="160" y="405" class="tiny" text-anchor="middle" >viability labels</text>
</g>
<g id="panel-B"><rect id="panel-B-background" x="1260" y="16" width="624" height="430" rx="18" class="panel"/><text x="1278" y="54" class="panel-label" text-anchor="start" >B</text><text x="1318" y="54" class="panel-title" text-anchor="start" >QC retention and label distribution</text>
<rect x="1300" y="150" width="65" height="191.62" fill="#72a5b3"/><rect x="1300" y="150" width="65" height="28.379999999999995" fill="#c8d9de"/>
<text x="1332" y="128" class="small-bold" text-anchor="middle" >87.1%</text>
<text x="1332" y="408" class="small" text-anchor="middle" >Green</text>
<rect x="1435" y="150" width="65" height="193.6" fill="#72a5b3"/><rect x="1435" y="150" width="65" height="26.400000000000006" fill="#c8d9de"/>
<text x="1467" y="128" class="small-bold" text-anchor="middle" >88.0%</text>
<text x="1467" y="408" class="small" text-anchor="middle" >Red</text>
<rect x="1570" y="150" width="65" height="181.94" fill="#72a5b3"/><rect x="1570" y="150" width="65" height="38.06" fill="#c8d9de"/>
<text x="1602" y="128" class="small-bold" text-anchor="middle" >82.7%</text>
<text x="1602" y="408" class="small" text-anchor="middle" >Sample</text>
<text x="1478" y="82" class="body" text-anchor="middle" >QC retention</text>
<text x="1785" y="105" class="small-bold" text-anchor="middle" >Viability distribution</text>
<rect x="1695" y="358" width="14" height="12" transform="translate(0 0)" fill="#9fc7d8"/>
<rect x="1695" y="352" width="14" height="18" transform="translate(15 0)" fill="#9fc7d8"/>
<rect x="1695" y="345" width="14" height="25" transform="translate(30 0)" fill="#9fc7d8"/>
<rect x="1695" y="332" width="14" height="38" transform="translate(45 0)" fill="#9fc7d8"/>
<rect x="1695" y="316" width="14" height="54" transform="translate(60 0)" fill="#9fc7d8"/>
<rect x="1695" y="294" width="14" height="76" transform="translate(75 0)" fill="#9fc7d8"/>
<rect x="1695" y="265" width="14" height="105" transform="translate(90 0)" fill="#9fc7d8"/>
<rect x="1695" y="238" width="14" height="132" transform="translate(105 0)" fill="#9fc7d8"/>
<rect x="1695" y="212" width="14" height="158" transform="translate(120 0)" fill="#9fc7d8"/>
<rect x="1695" y="190" width="14" height="180" transform="translate(135 0)" fill="#9fc7d8"/>
<rect x="1695" y="220" width="14" height="150" transform="translate(150 0)" fill="#9fc7d8"/>
<rect x="1695" y="278" width="14" height="92" transform="translate(165 0)" fill="#9fc7d8"/>
<path d="M1685 370 H1878 M1685 370 V150" class="line"/>
<text x="1782" y="408" class="small" text-anchor="middle" >viability score</text>
</g>
<g id="panel-C"><rect id="panel-C-background" x="16" y="465" width="670" height="775" rx="18" class="panel"/><text x="34" y="503" class="panel-label" text-anchor="start" >C</text><text x="74" y="503" class="panel-title" text-anchor="start" >Training data and deployment</text>
<image x="45" y="535" width="610" height="245" preserveAspectRatio="xMidYMid meet" xlink:href="../assets/viability_representative_grid.png"/>
<text x="350" y="815" class="small" text-anchor="middle" >Representative bright-field, LIVE, DEAD, and ROI-mask pairs</text>
<rect id="training-inference" x="55" y="865" width="575" height="310" rx="18" class="soft-node"/>
<text x="342" y="905" class="body" text-anchor="middle" >Training</text>
<text x="342" y="945" class="small" text-anchor="middle"><tspan x="342" dy="0">bright-field ROI + fluorescence-derived label</tspan><tspan x="342" dy="31">→ regression and ranking objectives</tspan><tspan x="342" dy="31">→ optimized ConvNeXt checkpoint</tspan></text>
<path d="M80 1035 H605" class="dash"/>
<text x="342" y="1075" class="body" text-anchor="middle" >Deployment inference</text>
<text x="342" y="1112" class="small" text-anchor="middle"><tspan x="342" dy="0">bright-field image → YOLO → SAM → ROI crop</tspan><tspan x="342" dy="31">→ checkpoint-1 → viability score</tspan></text>
<text x="342" y="1198" class="tiny-bold" text-anchor="middle" >No fluorescence input is required during inference.</text>
</g>
<g id="panel-D"><rect id="panel-D-background" x="705" y="465" width="1179" height="775" rx="18" class="panel"/><text x="723" y="503" class="panel-label" text-anchor="start" >D</text><text x="763" y="503" class="panel-title" text-anchor="start" >ConvNeXt multi-scale viability regressor</text>
<rect id="roi-input" x="745" y="735" width="170" height="150" rx="18" class="blue"/>
<circle cx="830" cy="790" r="40" fill="#88999e"/><circle cx="855" cy="815" r="32" fill="#a9b6ba"/>
<text x="830" y="850" class="small-bold" text-anchor="middle" >384 × 384 ROI</text>
<text x="830" y="878" class="tiny" text-anchor="middle" >RGB bright-field</text>
<path id="" d="M920,810 L945,810" class="arrow"/>
<path d="M950 710 L1110 745 V875 L950 910Z" fill="#9fc4e5" stroke="#496f7d" stroke-width="3"/>
