<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1600" height="420" viewBox="0 0 1600 420">
  <title>Editable data-to-analysis workflow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .label { font: 600 28px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .body { font: 22px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 18px Arial, Helvetica, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2.5; rx: 18; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

<rect width="1600" height="420" fill="white"/>
<g id="step-1"><rect x="50" y="115" width="240" height="150" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="170" y="172" text-anchor="middle" class="body">Raw bright-field</text>
<text x="170" y="208" text-anchor="middle" class="body">images</text>
</g>
<path d="M 295 190 H 342" class="arrow"/>
<g id="step-2"><rect x="350" y="115" width="240" height="150" rx="20" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
<text x="470" y="172" text-anchor="middle" class="body">Image QC and</text>
<text x="470" y="208" text-anchor="middle" class="body">metadata validation</text>
</g>
<path d="M 595 190 H 642" class="arrow"/>
<g id="step-3"><rect x="650" y="115" width="240" height="150" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="770" y="172" text-anchor="middle" class="body">Canonical dataset</text>
<text x="770" y="208" text-anchor="middle" class="body">and provenance</text>
</g>
<path d="M 895 190 H 942" class="arrow"/>
<g id="step-4"><rect x="950" y="115" width="240" height="150" rx="20" fill="#faf5ff" stroke="#9333ea" stroke-width="3"/>
<text x="1070" y="172" text-anchor="middle" class="body">Morphology and</text>
<text x="1070" y="208" text-anchor="middle" class="body">viability workflows</text>
</g>
<path d="M 1190 190 H 1280 V 72 H 1350" class="arrow"/>
<path d="M 1280 190 V 190 H 1350" class="arrow"/>
<path d="M 1280 190 V 308 H 1350" class="arrow"/>
<g><rect x="1350" y="35" width="200" height="74" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="1450" y="82" text-anchor="middle" class="body">Density</text></g>
<g><rect x="1350" y="153" width="200" height="74" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="1450" y="200" text-anchor="middle" class="body">Alginate</text></g>
<g><rect x="1350" y="271" width="200" height="74" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/><text x="1450" y="318" text-anchor="middle" class="body">Y-27632</text></g>
</svg>