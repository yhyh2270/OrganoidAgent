<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1800" height="620" viewBox="0 0 1800 620">
  <title>Editable multiscale segmentation workflow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .label { font: 600 28px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .body { font: 22px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 18px Arial, Helvetica, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2.5; rx: 18; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

<rect width="1800" height="620" fill="white"/>
<g id="node-1"><rect x="45" y="220" width="230" height="120" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="160.0" y="269" text-anchor="middle" class="body">Raw TIFF</text><text x="160.0" y="302" text-anchor="middle" class="small">bright-field image</text></g>
<g id="node-2"><rect x="340" y="220" width="250" height="120" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><text x="465.0" y="269" text-anchor="middle" class="body">Normalize</text><text x="465.0" y="302" text-anchor="middle" class="small">grayscale + CLAHE</text></g>
<g id="node-3"><rect x="655" y="220" width="250" height="120" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="780.0" y="269" text-anchor="middle" class="body">Hybrid signal</text><text x="780.0" y="302" text-anchor="middle" class="small">foreground + residual</text></g>
<g id="node-4"><rect x="970" y="70" width="250" height="120" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="1095.0" y="119" text-anchor="middle" class="body">Cellpose</text><text x="1095.0" y="152" text-anchor="middle" class="small">multiscale branches</text></g>
<g id="node-5"><rect x="970" y="250" width="250" height="120" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="1095.0" y="299" text-anchor="middle" class="body">Support mask</text><text x="1095.0" y="332" text-anchor="middle" class="small">signal thresholds</text></g>
<g id="node-6"><rect x="970" y="430" width="250" height="120" rx="18" fill="#faf5ff" stroke="#9333ea" stroke-width="3"/><text x="1095.0" y="479" text-anchor="middle" class="body">Large recovery</text><text x="1095.0" y="512" text-anchor="middle" class="small">components + watershed</text></g>
<g id="node-7"><rect x="1305" y="220" width="260" height="120" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/><text x="1435.0" y="269" text-anchor="middle" class="body">Candidate scoring</text><text x="1435.0" y="302" text-anchor="middle" class="small">overlap-aware merge</text></g>
<g id="node-8"><rect x="1630" y="220" width="130" height="120" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="1695.0" y="269" text-anchor="middle" class="body">Final</text><text x="1695.0" y="302" text-anchor="middle" class="small">instances</text></g>
<path d="M 275 280 H 330" class="arrow"/>
<path d="M 590 280 H 645" class="arrow"/>
<path d="M 905 280 H 935 V 130 H 960" class="arrow"/>
<path d="M 905 280 H 960" class="arrow"/>
<path d="M 905 280 H 935 V 490 H 960" class="arrow"/>
<path d="M 1220 130 H 1260 V 280 H 1295" class="arrow"/>
<path d="M 1220 310 H 1295" class="arrow"/>
<path d="M 1220 490 H 1260 V 310 H 1295" class="arrow"/>
<path d="M 1565 280 H 1620" class="arrow"/>
<text x="45" y="65" class="label">Multiscale organoid instance segmentation</text>
<text x="45" y="100" class="small">All nodes, labels, colors, and connectors are editable SVG objects.</text>
</svg>